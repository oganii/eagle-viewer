<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f2f7" />
  <script>
    // 最初のフレームより前に data-theme を書き込み、テーマのちらつきを防ぐ。
    // PWA の外側は物理画面の高さで画面を埋め、CSS で small viewport のレイアウト高さに戻す。
    // これで iOS の最初の画面でナビゲーションの文字が見え、下の背景も途切れない。
    (function () {
      try {
        var map = {
          light: ['light', 'blue'],
          dark: ['dark', 'blue'],
          gallery: ['light', 'blue'],
          workbench: ['dark', 'blue'],
          carbon: ['dark', 'blue']
        };
        var name = localStorage.getItem('eagle-viewer-theme');
        var pair = map[name] || (window.matchMedia('(prefers-color-scheme: dark)').matches ? ['dark', 'blue'] : ['light', 'blue']);
        document.documentElement.setAttribute('data-theme', pair[0]);
        document.documentElement.setAttribute('data-accent', pair[1]);
        document.documentElement.style.colorScheme = pair[0];
      } catch (e) {}
    })();
    // iOS のホーム画面起動の目印：standalone ではレイアウトビューポートが物理画面より低い（ビューポート単位はレイアウトビューポートの
    // 高さを返す）。下部バー/プレビュー操作バーはビューポートの高さで下端に付ければ常に見える。ビューポート外の画面下部は
    // CSS が html キャンバスの同じ色の背景で埋める（mobile.css の全体 canvas ルールを参照）。
    // screen.height でコンテナを伸ばさないこと：これは物理画面全体の高さで、レイアウトビューポートより大きく、
    // 下部バーをビューポートの外へ押し出してしまう。
    // テーマの書き込みとは別の try にして、localStorage が制限されていても standalone の判定が巻き添えにならないようにする。
    // 一部の iOS バージョンでは navigator.standalone が true にならないので、display-mode メディアクエリで補う
    //（インストール済み PWA は standalone か fullscreen に一致しうる。WebKit #264218 を参照）。
    (function () {
      try {
        var isStandalone = window.navigator.standalone ||
          (window.matchMedia && (window.matchMedia('(display-mode: standalone)').matches ||
                                 window.matchMedia('(display-mode: fullscreen)').matches));
        if (isStandalone) {
          document.documentElement.classList.add('pwa-standalone');
          var setPwaOuterHeight = function () {
            var land = window.matchMedia('(orientation: landscape)').matches;
            var h = land ? window.screen.width : window.screen.height;
            document.documentElement.style.setProperty('--pwa-outer-h', h + 'px');
          };
          setPwaOuterHeight();
          window.addEventListener('orientationchange', setPwaOuterHeight);
          window.addEventListener('resize', setPwaOuterHeight);
        }
      } catch (e) {}
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/static/icon-192.png" />
  <title>Eagle Vault Viewer</title>
  <link rel="stylesheet" href="/static/mobile.css?v=1.155-ja1" />
</head>
<body>
  <div id="app">
    <header class="top" id="topbar">
      <!-- JS が描画：戻るボタン + タイトル / パンくず -->
    </header>

    <main class="bd" id="view">
      <div class="pad" id="viewBody">
        <div class="spinner"></div>
      </div>
    </main>

    <nav class="tabs" id="tabs">
      <button class="tb active" data-view="library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4M3 17l9 4 9-4"/></svg>
        <span id="tabLibrary">ライブラリ</span>
      </button>
      <button class="tb" data-view="folders">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
        <span id="tabFolders">フォルダ</span>
      </button>
      <button class="tb" data-view="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span id="tabSearch">検索</span>
      </button>
    </nav>
  </div>

  <!-- プレビューのオーバーレイ -->
  <div class="overlay" id="preview" aria-hidden="true">
    <div class="pv-top">
      <button id="pvClose" aria-label="閉じる">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <button id="pvPrev" class="pv-nav" aria-label="前へ">‹</button>
      <span class="ix" id="pvIndex">1 / 1</span>
      <button id="pvNext" class="pv-nav" aria-label="次へ">›</button>
      <span class="spacer"></span>
      <button id="pvShare" aria-label="共有">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 3v13M8 7l4-4 4 4"/></svg>
      </button>
    </div>
    <div class="pv-stage" id="pvStage">
      <img class="pv-img" id="pvImg" alt="" decoding="async" />
    </div>
    <div class="pv-bottom">
      <div class="nm" id="pvName">—</div>
      <div class="meta" id="pvMeta">—</div>
      <div class="pv-actions">
        <a id="pvDownload" class="primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg>
          <span id="pvDownloadLabel">ダウンロード</span>
        </a>
        <button id="pvOriginal" class="primary" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M4 5h16v14H4z"/><path d="m7 15 3-3 2 2 2-2 3 3"/><circle cx="9" cy="9" r="1.2"/></svg>
          <span id="pvOriginalLabel">元画像を表示</span>
        </button>
        <button id="pvSave" class="primary" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M5 7h3l2-2h4l2 2h3v12H5z"/><circle cx="12" cy="13" r="3.2"/></svg>
          <span id="pvSaveLabel">写真に保存</span>
        </button>
      </div>
    </div>
  </div>

  <script src="/static/mobile.js?v=1.155-ja1"></script>
</body>
</html>
